name: Build SWAFL.exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths: ['Software/SWAFL_Desktop/**', 'package.json']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Locate project
        shell: bash
        run: |
          if [ -f package.json ]; then echo "PROJ=." >> $GITHUB_ENV; else echo "PROJ=Software/SWAFL_Desktop" >> $GITHUB_ENV; fi
      - name: Install
        shell: bash
        run: cd "$PROJ" && npm install
      - name: Build exe
        shell: bash
        run: cd "$PROJ" && npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SWAFL-windows
          path: |
            ${{ env.PROJ }}/dist/SWAFL.exe
            ${{ env.PROJ }}/dist/SWAFL-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJ }}/dist/SWAFL.exe
            ${{ env.PROJ }}/dist/SWAFL-Setup.exe
