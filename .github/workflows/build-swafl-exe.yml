name: Build SWAFL.exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Locate project
        shell: bash
        run: |
          if [ -f package.json ]; then echo "PROJ=." >> $GITHUB_ENV; else echo "PROJ=Software/SWAFL_Desktop" >> $GITHUB_ENV; fi
      - name: Install
        shell: bash
        run: cd "$PROJ" && npm install
      - name: Build exe
        shell: bash
        run: cd "$PROJ" && npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: SWAFL-windows
          path: |
            ${{ env.PROJ }}/dist/SWAFL.exe
            ${{ env.PROJ }}/dist/SWAFL-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SWAFL Desktop ${{ github.ref_name }}
          body: |
            Download area for the SWAFL desktop app (Windows).
            - `SWAFL.exe`: portable app, double-click to run.
            - `SWAFL-Setup.exe`: installer.
            - `SWAFL_Desktop.zip`: the source; build it yourself with `npm.cmd install` then `npm.cmd run get-app`.
            The exe files are unsigned, so Windows SmartScreen may ask: More info, then Run anyway.
          files: |
            Software/SWAFL_Desktop.zip
            ${{ env.PROJ }}/dist/SWAFL.exe
            ${{ env.PROJ }}/dist/SWAFL-Setup.exe
